name: Push Notification Daemon

on:
  schedule:
    - cron: '*/5 * * * *'  # 每5分钟（备份）
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install web-push
      - run: node send-pushes.js
