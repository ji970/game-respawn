name: Push Notification Daemon

on:
  workflow_dispatch:          # 仅手动触发

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install web-push
      - run: node send-pushes.js
